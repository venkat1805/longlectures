<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammu's First Day ♡</title>

<style>
:root{
  --cream:#fff8ec;
  --paper:#fffdf7;
  --lav:#d0d2ff;
  --lavink:#55436d;
  --pink:#ef7890;
  --ink:#49352d;
  --muted:#806f78;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(208,210,255,.5),transparent 25%),
    radial-gradient(circle at 90% 20%,rgba(249,199,209,.45),transparent 25%),
    var(--cream);
  color:var(--ink);
  font-family:"Trebuchet MS",system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.paper{
  width:min(100%,650px);
  background:var(--paper);
  border-radius:12px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(73,53,45,.12);
  position:relative;
}

.paper:before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px dashed rgba(73,53,45,.12);
  border-radius:8px;
  pointer-events:none;
}

.bouquet{
  width:min(100%,470px);
  margin:auto;
}

.bouquet img{
  width:100%;
  display:block;
}

.kicker{
  display:inline-block;
  padding:7px 11px;
  background:#efedff;
  color:var(--lavink);
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.05em;
}

h1,h2{
  font-family:"Comic Sans MS","Bradley Hand",cursive;
  color:var(--lavink);
}

h1{
  font-size:clamp(42px,11vw,70px);
  line-height:.9;
  margin:12px 0;
}

.sub{
  line-height:1.5;
}

.btn{
  border:0;
  border-radius:999px;
  padding:13px 19px;
  font-weight:900;
  cursor:pointer;
}

.primary{
  color:white;
  background:var(--pink);
  box-shadow:0 8px 18px rgba(239,120,144,.22);
}

.small{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.pill{
  display:inline-block;
  background:#fff0f3;
  padding:7px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="paper">

  <div class="bouquet">
    <img src="assets/bouquet.png" alt="Bouquet for Ammu">
  </div>

  <span class="pill">(umm same bouquet ik 🌚)</span>

  <br><br>

  <span class="kicker">
    muhahaa, here's a lil something for the long ahh lecture days ♡
  </span>

  <h1>
    Today's<br>
    YOUR DAYY<br>
    BANGARAMM
  </h1>

  <p class="sub">
    long day so um obv I had to annoy you a little hehee 😋♡
  </p>

  <button class="btn primary" onclick="location.href='day.html'">
    kannu therinja inga press pannunga maam 😛🥰
  </button>

  <p class="small">
    Come back before every class and ask me for your clue hehee
  </p>

</div>

</body>
</html>
